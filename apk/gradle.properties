# Configuración de Gradle para el proyecto TrackCam
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX (obligatorio con las dependencias modernas)
android.useAndroidX=true

# Genera R classes solo del módulo propio (builds más rápidos)
android.nonTransitiveRClass=true

# Estilo oficial de Kotlin
kotlin.code.style=official
